<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#effaf7">
<meta name="robots" content="noindex">
<title>ميزان</title>
<script>
(function(){
 const target=new URL('/secure-v3.html',location.origin);
 new URLSearchParams(location.search).forEach((v,k)=>{if(k!=='v'&&k!=='_updated')target.searchParams.set(k,v)});
 target.searchParams.set('v','502');
 target.hash=location.hash;
 const go=()=>location.replace(target.href);
 if('serviceWorker' in navigator){
   navigator.serviceWorker.register('/sw.js?v=502',{scope:'/'}).catch(()=>{}).finally(go);
   setTimeout(go,900);
 } else go();
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/secure-v3.html?v=502"></noscript>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:linear-gradient(180deg,#edf9f5,#f8fcfb);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#0c806b}
.loader{text-align:center}.logo{font-size:46px;font-weight:900;margin-bottom:8px}small{color:#718a84}
</style>
</head>
<body><div class="loader"><div class="logo">ميزان</div><small>جاري فتح النسخة الآمنة</small></div></body>
</html>
