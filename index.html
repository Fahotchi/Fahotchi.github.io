<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#effaf7">
<meta name="robots" content="noindex">
<title>ميزان</title>
<script>
(function(){
  var target='/secure-v3.html'+location.search+location.hash;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', {scope:'/'})
      .catch(function(){})
      .finally(function(){ location.replace(target); });
    setTimeout(function(){ if(!location.pathname.endsWith('secure-v3.html')) location.replace(target); }, 700);
  } else {
    location.replace(target);
  }
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0;url=/secure-v3.html">
</noscript>

html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:linear-gradient(180deg,#edf9f5,#f8fcfb);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#0c806b}
.loader{text-align:center}
.logo{font-size:46px;font-weight:900;margin-bottom:8px}
small{color:#718a84}
</style>
</head>
<body>
